name: Netboot

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Quick Install Lix
        uses: canidae-solutions/lix-quick-install-action@v4

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Build
        run: nix-build -A netboot.kernel -A netboot.initrd -A netboot.ipxe
        
      - run: nix-build shell.nix --no-out-link

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - run: nix-shell --run "tofu init" ../shell.nix
        working-directory: ./tofu

      - run: nix-shell --run "tofu apply -auto-approve -var pxe_bucket_ip_filter=false" ../shell.nix
        working-directory: ./tofu

      - run: nix-shell --run "tofu apply -auto-approve -var pxe_bucket_ip_filter=true" ../shell.nix
        working-directory: ./tofu
